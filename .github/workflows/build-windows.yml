name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-windows.txt
        pip install pyinstaller

    - name: Get version
      id: version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "version=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
        fi

    - name: Build executable
      run: |
        pyinstaller --name="Argus-Overview" `
          --onefile `
          --windowed `
          --add-data="assets;assets" `
          --hidden-import=PySide6.QtCore `
          --hidden-import=PySide6.QtGui `
          --hidden-import=PySide6.QtWidgets `
          --hidden-import=PIL `
          --hidden-import=PIL.Image `
          --hidden-import=pynput `
          --hidden-import=pynput.keyboard `
          --hidden-import=watchdog `
          --hidden-import=watchdog.observers `
          --hidden-import=watchdog.events `
          --hidden-import=argus_overview.platform `
          --hidden-import=argus_overview.platform.windows `
          --hidden-import=win32gui `
          --hidden-import=win32ui `
          --hidden-import=win32con `
          --hidden-import=win32api `
          --hidden-import=win32process `
          --hidden-import=pywintypes `
          --collect-all=PySide6 `
          --collect-all=pywin32 `
          src/main.py

    - name: Create artifact
      run: |
        cd dist
        7z a Argus-Overview-${{ steps.version.outputs.version }}-Windows.zip Argus-Overview.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: Argus-Overview-Windows
        path: dist/Argus-Overview-*.zip
        retention-days: 30

    - name: Upload to release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: dist/Argus-Overview-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
